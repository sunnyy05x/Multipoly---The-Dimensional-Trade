<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multipoly: The Dimensional Trade</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        :root {
            --bg: #0a0e1a;
            --grid: #1a2744;
            --cyan: #00e5ff;
            --gold: #ffd700;
            --text: #c8d6e5;
            --panel: #0d1321;
            --border: #1e3a5f;
            --brown: #8B4513;
            --ltblue: #4fc3f7;
            --pink: #f06292;
            --orange: #ff9800;
            --red: #ef5350;
            --green: #66bb6a;
            --station: #9c27b0;
            --special: #607d8b
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            background-image: linear-gradient(rgba(0, 229, 255, .04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 255, .04) 1px, transparent 1px);
            background-size: 40px 40px
        }

        h1 {
            color: var(--cyan);
            text-align: center;
            font-size: 1.4rem;
            margin: 8px 0;
            text-shadow: 0 0 15px rgba(0, 229, 255, .5);
            letter-spacing: 3px;
            text-transform: uppercase
        }

        .board-container {
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            grid-template-rows: repeat(11, 1fr);
            width: min(95vw, 750px);
            height: min(95vw, 750px);
            gap: 1px;
            background: var(--grid);
            border: 2px solid var(--cyan);
            box-shadow: 0 0 30px rgba(0, 229, 255, .15);
            position: relative
        }

        .tile {
            background: var(--panel);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: .48rem;
            padding: 1px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            transition: all .2s
        }

        .tile:hover {
            border-color: var(--cyan);
            z-index: 2;
            box-shadow: 0 0 8px rgba(0, 229, 255, .3)
        }

        .tile .color-bar {
            position: absolute;
            height: 4px;
            width: 100%;
            left: 0
        }

        .tile.bottom .color-bar,
        .tile.top .color-bar {
            bottom: 0
        }

        .tile.bottom .color-bar {
            top: 0;
            bottom: auto
        }

        .tile.left .color-bar {
            top: 0;
            right: 0;
            width: 4px;
            height: 100%
        }

        .tile.right .color-bar {
            top: 0;
            left: 0;
            width: 4px;
            height: 100%
        }

        .tile .t-name {
            font-weight: bold;
            text-align: center;
            line-height: 1.1;
            font-size: .45rem;
            margin: 1px 0
        }

        .tile .t-cost {
            color: var(--gold);
            font-size: .42rem
        }

        .tile .t-formula {
            color: var(--cyan);
            font-size: .4rem
        }

        .tile .players {
            display: flex;
            gap: 2px;
            position: absolute;
            bottom: 2px;
            right: 2px
        }

        .player-token {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 3px rgba(255, 255, 255, .5))
        }

        .player-token svg {
            width: 100%;
            height: 100%
        }

        .tile .house-count {
            position: absolute;
            top: 1px;
            right: 2px;
            color: var(--gold);
            font-size: .42rem;
            font-weight: bold
        }

        .center {
            grid-column: 2/11;
            grid-row: 2/11;
            background: var(--panel);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            overflow: hidden
        }

        .center h2 {
            color: var(--cyan);
            font-size: .9rem;
            margin-bottom: 5px;
            letter-spacing: 2px
        }

        .dice-area {
            display: flex;
            gap: 15px;
            margin: 8px 0
        }

        .die {
            width: 40px;
            height: 40px;
            background: var(--bg);
            border: 2px solid var(--cyan);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--gold);
            transition: transform .3s
        }

        .die.rolling {
            animation: roll .4s ease-out
        }

        @keyframes roll {
            0% {
                transform: rotateZ(0)
            }

            50% {
                transform: rotateZ(180deg) scale(1.2)
            }

            100% {
                transform: rotateZ(360deg)
            }
        }

        .log {
            flex: 1;
            width: 100%;
            overflow-y: auto;
            font-size: .55rem;
            border: 1px solid var(--border);
            padding: 5px;
            margin-top: 5px;
            background: rgba(0, 0, 0, .3);
            max-height: 200px
        }

        .log div {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255, 255, 255, .05)
        }

        .log .p0c {
            color: #ff4081
        }

        .log .p1c {
            color: #40c4ff
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 5px;
            justify-content: center
        }

        button {
            background: transparent;
            color: var(--cyan);
            border: 1px solid var(--cyan);
            padding: 5px 12px;
            font-family: inherit;
            font-size: .6rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all .2s
        }

        button:hover:not(:disabled) {
            background: rgba(0, 229, 255, .15);
            box-shadow: 0 0 10px rgba(0, 229, 255, .2)
        }

        button:disabled {
            opacity: .3;
            cursor: not-allowed
        }

        .dashboard {
            display: flex;
            gap: 10px;
            width: min(95vw, 750px);
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center
        }

        .player-panel {
            flex: 1;
            min-width: 280px;
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 4px
        }

        .player-panel h3 {
            font-size: .8rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px
        }

        .player-panel .p-icon {
            width: 20px;
            height: 20px
        }

        .stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 6px 0;
            font-size: .6rem
        }

        .stat {
            background: rgba(0, 229, 255, .05);
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: 3px
        }

        .stat b {
            color: var(--gold)
        }

        .inv {
            display: flex;
            gap: 8px;
            margin: 4px 0
        }

        .inv .card {
            padding: 4px 10px;
            border: 1px solid;
            border-radius: 3px;
            font-weight: bold;
            font-size: .65rem;
            transition: all .3s
        }

        .inv .card.M {
            border-color: #e91e63;
            color: #e91e63;
            background: rgba(233, 30, 99, .1)
        }

        .inv .card.L {
            border-color: #2196f3;
            color: #2196f3;
            background: rgba(33, 150, 243, .1)
        }

        .inv .card.T {
            border-color: #4caf50;
            color: #4caf50;
            background: rgba(76, 175, 80, .1)
        }

        .card-gain {
            animation: cardPop .5s ease-out
        }

        @keyframes cardPop {
            0% {
                transform: scale(1.5);
                opacity: 0
            }

            100% {
                transform: scale(1);
                opacity: 1
            }
        }

        .props-list {
            font-size: .5rem;
            max-height: 80px;
            overflow-y: auto;
            margin-top: 4px
        }

        .props-list div {
            padding: 1px 0
        }

        .active-panel {
            border-color: var(--cyan);
            box-shadow: 0 0 12px rgba(0, 229, 255, .2)
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .7);
            z-index: 100;
            align-items: center;
            justify-content: center
        }

        .modal-overlay.show {
            display: flex
        }

        .modal-box {
            background: var(--panel);
            border: 2px solid var(--cyan);
            padding: 20px;
            border-radius: 8px;
            max-width: 420px;
            width: 92%;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 229, 255, .3);
            max-height: 90vh;
            overflow-y: auto
        }

        .modal-box h3 {
            color: var(--cyan);
            margin-bottom: 10px;
            font-size: .85rem
        }

        .modal-box p {
            font-size: .6rem;
            margin: 6px 0
        }

        .modal-box .btns {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
            flex-wrap: wrap
        }

        /* Lab Bench */
        .lab-recipe {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 10px 0;
            flex-wrap: wrap
        }

        .lab-item {
            padding: 6px 10px;
            border-radius: 4px;
            font-size: .6rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 4px
        }

        .lab-item.has {
            border-color: #4caf50;
            color: #4caf50
        }

        .lab-item.miss {
            border-color: #ef5350;
            color: #ef5350
        }

        .lab-item .chk {
            font-size: .7rem
        }

        /* Market Modal */
        .market-grid {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 10px 0;
            flex-wrap: wrap
        }

        .market-btn {
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            transition: all .2s;
            background: rgba(0, 229, 255, .05);
            min-width: 60px
        }

        .market-btn:hover {
            border-color: var(--cyan)
        }

        .market-btn.sel {
            border-color: var(--gold);
            background: rgba(255, 215, 0, .1)
        }

        .market-btn.disabled {
            opacity: .3;
            pointer-events: none
        }

        .market-label {
            font-size: .5rem;
            color: var(--text);
            margin-top: 4px
        }

        /* Tooltip */
        .tooltip {
            display: none;
            position: absolute;
            background: #111827;
            border: 1px solid var(--cyan);
            border-radius: 6px;
            padding: 8px 10px;
            z-index: 50;
            min-width: 180px;
            pointer-events: none;
            font-size: .55rem;
            text-align: left;
            box-shadow: 0 0 15px rgba(0, 229, 255, .2)
        }

        .tooltip .tt-row {
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 2px 0
        }

        .tooltip .tt-chk {
            font-size: .65rem
        }

        .tile:hover .tooltip {
            display: block
        }

        /* Game Over */
        .gameover-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .85);
            z-index: 200;
            align-items: center;
            justify-content: center
        }

        .gameover-overlay.show {
            display: flex
        }

        .gameover-box {
            background: var(--panel);
            border: 3px solid var(--gold);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 0 60px rgba(255, 215, 0, .3)
        }

        .gameover-box h2 {
            color: var(--gold);
            font-size: 1.3rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 215, 0, .5)
        }

        .gameover-box p {
            font-size: .7rem;
            margin: 8px 0
        }

        /* Quiz */
        .quiz-tier {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: .5rem;
            font-weight: bold;
            margin-bottom: 6px
        }

        .tier-green {
            background: #1b5e20;
            color: #66bb6a
        }

        .tier-yellow {
            background: #e65100;
            color: #ffb74d
        }

        .tier-red {
            background: #b71c1c;
            color: #ef5350
        }

        .quiz-opts {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 10px 0
        }

        .quiz-opt {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: .6rem;
            text-align: left;
            transition: all .2s;
            background: rgba(0, 229, 255, .03)
        }

        .quiz-opt:hover {
            border-color: var(--cyan);
            background: rgba(0, 229, 255, .1)
        }

        .quiz-opt.correct {
            border-color: #4caf50;
            background: rgba(76, 175, 80, .2);
            color: #4caf50
        }

        .quiz-opt.wrong {
            border-color: #ef5350;
            background: rgba(239, 83, 80, .2);
            color: #ef5350
        }

        .quiz-result {
            margin: 10px 0;
            padding: 8px;
            border-radius: 6px;
            font-size: .6rem;
            font-weight: bold
        }

        .quiz-timer {
            font-size: 1.2rem;
            color: var(--gold);
            font-weight: bold;
            margin: 8px 0
        }

        .action-card {
            border: 2px solid var(--gold);
            border-radius: 8px;
            padding: 12px;
            margin: 8px 0;
            background: rgba(255, 215, 0, .05)
        }

        .action-card h4 {
            color: var(--gold);
            font-size: .7rem;
            margin-bottom: 4px
        }

        /* ── AI ASSISTANT ── */
        .ai-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0a0e1a, #1a2744);
            border: 2px solid var(--cyan);
            color: var(--cyan);
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 229, 255, .3), 0 4px 15px rgba(0, 0, 0, .4);
            transition: all .3s;
            animation: ai-pulse 2s infinite
        }

        .ai-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(0, 229, 255, .5), 0 4px 20px rgba(0, 0, 0, .5)
        }

        @keyframes ai-pulse {

            0%,
            100% {
                box-shadow: 0 0 20px rgba(0, 229, 255, .3)
            }

            50% {
                box-shadow: 0 0 30px rgba(0, 229, 255, .5), 0 0 60px rgba(0, 229, 255, .15)
            }
        }

        .ai-panel {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 360px;
            max-height: 480px;
            background: rgba(10, 14, 26, .95);
            backdrop-filter: blur(12px);
            border: 1px solid var(--cyan);
            border-radius: 12px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0, 229, 255, .15), 0 8px 32px rgba(0, 0, 0, .6);
            transform: translateY(20px) scale(.95);
            opacity: 0;
            pointer-events: none;
            transition: all .3s ease
        }

        .ai-panel.open {
            transform: translateY(0) scale(1);
            opacity: 1;
            pointer-events: all
        }

        .ai-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 229, 255, .05)
        }

        .ai-header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: .75rem;
            color: var(--cyan);
            letter-spacing: 1px
        }

        .ai-header-title span {
            font-size: 1.1rem
        }

        .ai-close {
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: .7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .2s
        }

        .ai-close:hover {
            border-color: #ef5350;
            color: #ef5350;
            background: rgba(239, 83, 80, .1)
        }

        .ai-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 250px;
            max-height: 340px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent
        }

        .ai-msg {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: .65rem;
            line-height: 1.5;
            animation: ai-msg-in .3s ease
        }

        @keyframes ai-msg-in {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .ai-msg.user {
            align-self: flex-end;
            background: rgba(0, 229, 255, .12);
            border: 1px solid rgba(0, 229, 255, .3);
            color: var(--cyan);
            border-bottom-right-radius: 4px
        }

        .ai-msg.bot {
            align-self: flex-start;
            background: rgba(255, 215, 0, .08);
            border: 1px solid rgba(255, 215, 0, .2);
            color: #eee;
            border-bottom-left-radius: 4px
        }

        .ai-msg.bot strong {
            color: var(--gold)
        }

        .ai-input-bar {
            display: flex;
            gap: 6px;
            padding: 10px 12px;
            border-top: 1px solid var(--border);
            background: rgba(0, 229, 255, .03)
        }

        .ai-input-bar input {
            flex: 1;
            background: rgba(255, 255, 255, .05);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text);
            font-size: .65rem;
            font-family: inherit;
            outline: none;
            transition: border-color .2s
        }

        .ai-input-bar input:focus {
            border-color: var(--cyan)
        }

        .ai-input-bar input::placeholder {
            color: rgba(255, 255, 255, .3)
        }

        .ai-send {
            background: linear-gradient(135deg, rgba(0, 229, 255, .15), rgba(0, 229, 255, .25));
            border: 1px solid var(--cyan);
            color: var(--cyan);
            border-radius: 8px;
            width: 38px;
            cursor: pointer;
            font-size: .85rem;
            transition: all .2s;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .ai-send:hover {
            background: rgba(0, 229, 255, .3);
            box-shadow: 0 0 12px rgba(0, 229, 255, .3)
        }

        .ai-typing {
            align-self: flex-start;
            padding: 8px 14px;
            font-size: .6rem;
            color: rgba(255, 215, 0, .6);
            font-style: italic
        }

        .ai-typing span {
            animation: ai-dot 1.4s infinite;
            display: inline-block
        }

        .ai-typing span:nth-child(2) {
            animation-delay: .2s
        }

        .ai-typing span:nth-child(3) {
            animation-delay: .4s
        }

        @keyframes ai-dot {

            0%,
            60%,
            100% {
                opacity: .3
            }

            30% {
                opacity: 1
            }
        }

        .setup-options {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }

        .setup-btn {
            background: var(--cyan);
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform .2s;
        }

        .setup-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--cyan);
        }
    </style>
</head>

<body>
    <h1>⚛ Multipoly: The Dimensional Trade ⚛</h1>
    <div class="board-container" id="board"></div>
    <div class="dashboard" id="dashboard"></div>
    <div class="modal-overlay" id="modal">
        <div class="modal-box" id="modalContent"></div>
    </div>
    <div class="modal-overlay" id="labModal">
        <div class="modal-box" id="labContent"></div>
    </div>
    <div class="modal-overlay" id="marketModal">
        <div class="modal-box" id="marketContent"></div>
    </div>
    <div class="gameover-overlay" id="gameoverOverlay">
        <div class="gameover-box" id="gameoverBox"></div>
    </div>
    <div class="modal-overlay" id="quizModal">
        <div class="modal-box" id="quizContent"></div>
    </div>

    <div class="modal-overlay" id="setupModal" style="display:flex; z-index: 300;">
        <div class="modal-box">
            <h2 style="color:var(--cyan);margin-bottom:15px">⚛ SELECT PLAYERS ⚛</h2>
            <div class="setup-options">
                <button class="setup-btn" onclick="startGame(2)">2 Players</button>
                <button class="setup-btn" onclick="startGame(3)">3 Players</button>
                <button class="setup-btn" onclick="startGame(4)">4 Players</button>
            </div>
        </div>
    </div>

    <!-- AI ASSISTANT -->
    <button class="ai-toggle" id="aiToggle" title="Ask Physics AI">🤖</button>
    <div class="ai-panel" id="aiPanel">
        <div class="ai-header">
            <div class="ai-header-title"><span>🤖</span> PHYSICS AI ASSISTANT</div>
            <button class="ai-close" id="aiClose" title="Close">✕</button>
        </div>
        <div class="ai-messages" id="aiMessages">
            <div class="ai-msg bot">👋 Hello! I'm your <strong>Physics AI Assistant</strong>. Ask me anything about

        // ── BOARD DATA ──

            { id: 15, name: 'Station β', type: 'station' },
            { id: 16, name: 'Momentum', formula: 'MLT⁻¹', cost: 180, group: 'orange', rent: 36, res: { M: 1, L: 1, T: 1 }, houseCost: 90 },
            { id: 17, name: 'Peer Review', type: 'chest' },
            { id: 18, name: 'Force', formula: 'MLT⁻²', cost: 180, group: 'orange', rent: 36, res: { M: 1, L: 1, T: 2 }, houseCost: 90 },

            { id: 24, name: 'Pressure', formula: 'ML⁻¹T⁻²', cost: 260, group: 'red', rent: 52, res: { M: 1, L: 1, T: 2 }, houseCost: 110 },

            { id: 26, name: 'Surface Tension', formula: 'MT⁻²', cost: 300, group: 'green', rent: 60, res: { M: 1, L: 0, T: 2 }, houseCost: 150 },
            { id: 27, name: 'Peer Review', type: 'chest' },
            { id: 28, name: 'Torque', formula: 'ML²T⁻²', cost: 320, group: 'green', rent: 64, res: { M: 1, L: 2, T: 2 }, houseCost: 150 },
            { id: 29, name: 'Luxury Tax', type: 'tax', amount: 150 },
            { id: 30, name: 'Go To Jail', type: 'gotojail' },
            { id: 31, name: 'Viscosity', formula: 'ML⁻¹T⁻¹', cost: 180, group: 'orange', rent: 36, res: { M: 1, L: 1, T: 1 }, houseCost: 90 },
            { id: 32, name: 'Experimental Results', type: 'chance' },
            { id: 33, name: 'Impulse', formula: 'MLT⁻¹', cost: 200, group: 'orange', rent: 40, res: { M: 1, L: 1, T: 1 }, houseCost: 90 },
            { id: 34, name: 'Station δ', type: 'station' },
            { id: 35, name: 'Peer Review', type: 'chest' },
            { id: 36, name: 'Entropy', formula: 'ML²T⁻²K⁻¹', cost: 280, group: 'green', rent: 56, res: { M: 1, L: 2, T: 2 }, houseCost: 150 },
            { id: 37, name: 'Experimental Results', type: 'chance' },
            { id: 38, name: 'Super Tax', type: 'tax', amount: 200 },
            { id: 39, name: 'Dark Energy', formula: 'ML²T⁻²', cost: 350, group: 'green', rent: 70, res: { M: 1, L: 2, T: 2 }, houseCost: 175 }
        ];

        // ── CARD DECKS ──
        const CHANCE_CARDS = [
            { text: 'Quantum fluctuation! Advance to The Big Bang.', action: p => { moveToTile(p, 0, true) } },
            { text: 'Wormhole detected! Collect 150g.', action: p => { players[p].gold += 150 } },
            { text: 'Dark matter collision! Pay 75g.', action: p => { players[p].gold -= 75; checkBankruptcy(p) } },
            { text: 'Lab grant approved! Gain 2 random resource cards.', action: p => { giveRandomCards(p, 2) } },
            { text: 'Equipment malfunction! Pay 50g.', action: p => { players[p].gold -= 50; checkBankruptcy(p) } },
            { text: 'Published a paper! Collect 100g.', action: p => { players[p].gold += 100 } },
            { text: 'Dimension rift! Go to Black Hole.', action: p => { sendToJail(p) } },
            { text: 'Eureka moment! Gain 1 of each resource.', action: p => { players[p].inv.M++; players[p].inv.L++; players[p].inv.T++ } },
            { text: 'Advance to nearest Dimension Station.', action: p => { const stations = [5, 15, 25, 34]; const pp = players[p].pos; let dest = stations.find(s => s > pp); if (!dest) dest = stations[0]; moveToTile(p, dest, dest < pp); giveRandomCards(p, 1); logMsg('🚀 ' + players[p].name + ' gains 1 resource card!', p) } },
            { text: 'Spacetime anomaly! Move back 3 spaces.', action: p => { players[p].pos = (players[p].pos - 3 + 40) % 40; updateTokens(); handleLanding() } }
        ];
        const CHEST_CARDS = [
            { text: 'Peer review positive! Collect 200g.', action: p => { players[p].gold += 200 } },
            { text: 'Lab fees due. Pay 100g.', action: p => { players[p].gold -= 100; checkBankruptcy(p) } },
            { text: 'Research funding! Gain 3 random resource cards.', action: p => { giveRandomCards(p, 3) } },
            { text: 'Conference travel grant: Collect 50g.', action: p => { players[p].gold += 50 } },
            { text: 'Citation error! Lose 1 Time card.', action: p => { if (players[p].inv.T > 0) players[p].inv.T--; logMsg(players[p].name + ' lost 1 T card.', p) } },
            { text: 'Collaborative study! Each opponent gives you 1 resource card.', action: p => { const opp = 1 - p; const types = ['M', 'L', 'T']; const t = types[Math.floor(Math.random() * 3)]; if (players[opp].inv[t] > 0) { players[opp].inv[t]--; players[p].inv[t]++; logMsg(players[opp].name + ' gave 1 ' + t + ' to ' + players[p].name, p) } else { logMsg(players[opp].name + ' has no ' + t + ' to give.', p) } } },
            { text: 'Thesis rejected. Pay 60g.', action: p => { players[p].gold -= 60; checkBankruptcy(p) } },
            { text: 'Nobel nomination buzz! Collect 250g.', action: p => { players[p].gold += 250 } },
            { text: 'Lab accident! Lose 1 Mass card.', action: p => { if (players[p].inv.M > 0) players[p].inv.M--; logMsg(players[p].name + ' lost 1 M card.', p) } },
            { text: 'Symmetry breakthrough! Gain 2 Length cards.', action: p => { players[p].inv.L += 2 } }
        ];

        // ── PLAYER STATE ──
        let players = [];
        let current = 0, turnPhase = 'roll', gameOver = false;
        let lastDice = [0, 0];
        let marketGive = '', marketGet = '';

        // ── GRID LAYOUT ──
        function getTileGridPos(id) {
            if (id >= 0 && id <= 10) return { row: 10, col: 10 - id };
            if (id >= 11 && id <= 20) return { row: 20 - id, col: 0 };
            if (id >= 21 && id <= 30) return { row: 0, col: id - 20 };
            if (id >= 31 && id <= 39) return { row: id - 30, col: 10 };
            return { row: 0, col: 0 };
        }
        function getSide(id) {
            if (id >= 0 && id <= 10) return 'bottom';
            if (id >= 11 && id <= 20) return 'left';
            if (id >= 21 && id <= 30) return 'top';
            return 'right';
        }
        function getTileIcon(t) {
            if (t.type === 'go') return '💥'; if (t.type === 'jail') return '🕳️'; if (t.type === 'free') return '🌀';
            if (t.type === 'gotojail') return '⚠️'; if (t.type === 'station') return '🚀'; if (t.type === 'chance') return '🔬';
            if (t.type === 'chest') return '📄'; if (t.type === 'tax') return '💰'; if (t.type === 'utility') return '⚡'; return '';
        }

        // ── TOOLTIP BUILDER ──
        function buildTooltip(tile) {
            if (!tile.group) return '';
            const p = players[current];
            let html = '<div class="tooltip">';
            html += `<div style="color:var(--gold);font-weight:bold;margin-bottom:3px">${tile.name}</div>`;
            html += `<div>Cost: <span style="color:var(--gold)">${tile.cost}g</span></div>`;
            if (tile.formula) html += `<div>Formula: <span style="color:var(--cyan)">${tile.formula}</span></div>`;
            if (tile.res) {
                html += '<div style="margin-top:3px;font-weight:bold">Build needs:</div>';
                ['M', 'L', 'T'].forEach(r => {
                    if (tile.res[r] > 0) {
                        const has = p.inv[r] >= tile.res[r];
                        html += `<div class="tt-row"><span class="tt-chk">${has ? '✅' : '❌'}</span>${r}×${tile.res[r]} (you:${p.inv[r]})</div>`;
                    }
                });
                html += `<div class="tt-row">+ ${tile.houseCost || 50}g per house</div>`;
            }
            const owner = getOwner(tile.id);
            if (owner !== null) { html += `<div style="margin-top:3px">Owner: ${players[owner].name}</div>`; }
            else { html += `<div style="opacity:.6;margin-top:3px">Unowned</div>`; }
            html += '</div>';
            return html;
        }

        // ── RENDER BOARD ──
        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            const center = document.createElement('div');
            center.className = 'center'; center.id = 'center';
            center.style.gridColumn = '2/11'; center.style.gridRow = '2/11';
            center.innerHTML = `<h2>⚛ CONTROL ⚛</h2>
  <div class="dice-area"><div class="die" id="d1">?</div><div class="die" id="d2">?</div></div>
  <div class="controls">
   <button id="btnRoll" onclick="rollDice()">🎲 Roll Dice</button>
   <button id="btnBuy" onclick="buyProperty()" disabled>💰 Buy License</button>
   <button id="btnLab" onclick="openLabBench()" disabled>⚗ Lab Bench</button>
   <button id="btnMarket" onclick="openMarket()">🔄 Market</button>
   <button id="btnJail" onclick="payJail()" style="display:none">🕳️ Pay 50g (Escape)</button>
   <button id="btnEnd" onclick="endTurn()" disabled>⏭ End Turn</button>
  </div>
  <div class="log" id="log"></div>`;
            board.appendChild(center);
            TILES.forEach(tile => {
                const gp = getTileGridPos(tile.id);
                const div = document.createElement('div');
                div.className = 'tile ' + getSide(tile.id);
                div.id = 'tile-' + tile.id;
                div.style.gridRow = String(gp.row + 1);
                div.style.gridColumn = String(gp.col + 1);
                div.onclick = () => showTileInfo(tile.id);
                let inner = '';
                if (tile.group) inner += `<div class="color-bar" style="background:${GROUPS[tile.group]}"></div>`;
                inner += `<div class="t-name">${getTileIcon(tile)}${tile.name}</div>`;
                if (tile.cost) inner += `<div class="t-cost">${tile.cost}g</div>`;
                if (tile.formula) inner += `<div class="t-formula">${tile.formula}</div>`;
                inner += `<div class="players" id="players-${tile.id}"></div>`;
                inner += `<div class="house-count" id="houses-${tile.id}"></div>`;
                inner += buildTooltip(tile);
                div.innerHTML = inner;
                board.appendChild(div);
            });
            updateTokens();
        }

        function refreshTooltips() {
            TILES.forEach(tile => {
                if (!tile.group) return;
                const el = document.getElementById('tile-' + tile.id);
                if (!el) return;
                const old = el.querySelector('.tooltip');
                if (old) old.remove();
                el.insertAdjacentHTML('beforeend', buildTooltip(tile));
            });
        }

        function updateTokens() {
            TILES.forEach(t => {
                const el = document.getElementById('players-' + t.id); if (!el) return;
                el.innerHTML = '';
                players.forEach((p, i) => {
                    if (p.pos === t.id) {
                        const tk = document.createElement('div');
                        tk.className = 'player-token';
                        tk.innerHTML = PLAYER_SVGS[i];
                        el.appendChild(tk);
                    }
                });
                const hEl = document.getElementById('houses-' + t.id);
                if (hEl) {
                    const owned = getOwner(t.id);
                    if (owned !== null && t.group) {
                        const houses = players[owned].props.find(pp => pp.id === t.id)?.houses || 0;
                        hEl.textContent = houses > 0 ? '🏠'.repeat(Math.min(houses, 4)) + (houses >= 5 ? '🏛️' : '') : '';
                    } else hEl.textContent = '';
                }
            });
        }

        function renderDashboard() {
            const dash = document.getElementById('dashboard'); dash.innerHTML = '';
            players.forEach((p, i) => {
                const panel = document.createElement('div');
                panel.className = `player-panel ${i === current ? 'active-panel' : ''}`;
                const propsList = p.props.map(pp => {
                    const t = TILES[pp.id];
                    return `<div style="color:${GROUPS[t.group] || '#fff'}">${t.name} ${pp.houses > 0 ? (pp.houses >= 5 ? '🏛️' : '🏠×' + pp.houses) : ''}</div>`;
                }).join('');
                panel.innerHTML = `
   <h3><span class="p-icon">${PLAYER_SVGS[i]}</span>${p.name} ${p.inJail ? '[IN BLACK HOLE]' : ''}</h3>
   <div class="stats"><div class="stat">Gold: <b>${p.gold}g</b></div></div>
   <div class="inv">
    <div class="card M" id="cardM${i}">M:${p.inv.M}</div>
    <div class="card L" id="cardL${i}">L:${p.inv.L}</div>
    <div class="card T" id="cardT${i}">T:${p.inv.T}</div>
   </div>
   <div class="props-list">${propsList || '<div style="opacity:.5">No properties</div>'}</div>`;
                dash.appendChild(panel);
            });
        }

        // ── GAME LOGIC ──
        function logMsg(msg, pIdx) {
            const el = document.getElementById('log'); if (!el) return;
            const div = document.createElement('div');
            div.className = pIdx !== undefined ? `p${pIdx}c` : '';
            div.textContent = msg; el.prepend(div);
        }

        function rollDice() {
            if (turnPhase !== 'roll' || gameOver) return;
            const p = players[current];
            lastDice = [Math.ceil(Math.random() * 6), Math.ceil(Math.random() * 6)];
            const total = lastDice[0] + lastDice[1];
            document.getElementById('d1').textContent = lastDice[0];
            document.getElementById('d2').textContent = lastDice[1];
            document.getElementById('d1').classList.add('rolling');
            document.getElementById('d2').classList.add('rolling');
            setTimeout(() => { document.getElementById('d1').classList.remove('rolling'); document.getElementById('d2').classList.remove('rolling') }, 400);
            logMsg(`${p.name} rolled ${lastDice[0]}+${lastDice[1]}=${total}`, current);

            if (p.inJail) {
                if (lastDice[0] === lastDice[1]) { p.inJail = false; p.jailTurns = 0; logMsg(`${p.name} rolled doubles! Escaped Black Hole!`, current); }
                else {
                    p.jailTurns++;
                    if (p.jailTurns >= 3) { p.inJail = false; p.jailTurns = 0; p.gold -= 50; logMsg(`${p.name} paid 50g to escape Black Hole.`, current); checkBankruptcy(current); }
                    else { logMsg(`${p.name} stuck in Black Hole. (Turn ${p.jailTurns}/3)`, current); turnPhase = 'done'; updateButtons(); renderDashboard(); return; }
                }
            }
            const oldPos = p.pos;
            p.pos = (p.pos + total) % 40;
            if (p.pos < oldPos) { p.gold += 200; giveRandomCards(current, 2); logMsg(`${p.name} passed The Big Bang! +200g +2 cards`, current); }
            updateTokens(); turnPhase = 'action';
            handleLanding(); updateButtons(); renderDashboard(); refreshTooltips();
        }

        function moveToTile(pIdx, tileId, collectGo) {
            const p = players[pIdx];
            if (collectGo && tileId <= p.pos) { p.gold += 200; giveRandomCards(pIdx, 2); logMsg(`${p.name} passed The Big Bang! +200g +2 cards`, pIdx); }
            p.pos = tileId; updateTokens();
        }

        function handleLanding() {
            const p = players[current]; const tile = TILES[p.pos];
            logMsg(`${p.name} landed on ${tile.name}`, current);
            if (tile.type === 'tax') { p.gold -= tile.amount; logMsg(`${p.name} pays ${tile.amount}g tax.`, current); checkBankruptcy(current); }
            else if (tile.type === 'gotojail') { sendToJail(current); }
            else if (tile.type === 'chance') { const card = CHANCE_CARDS[Math.floor(Math.random() * CHANCE_CARDS.length)]; logMsg(`🔬 ${card.text}`, current); card.action(current); }
            else if (tile.type === 'chest') { const card = CHEST_CARDS[Math.floor(Math.random() * CHEST_CARDS.length)]; logMsg(`📄 ${card.text}`, current); card.action(current); }
            else if (tile.type === 'station') { giveRandomCards(current, 1); logMsg(`🚀 ${p.name} gains 1 resource card!`, current); }
            else if (tile.group) {
                const owner = getOwner(tile.id);
                if (owner !== null && owner !== current) { const rent = calcRent(tile, owner); p.gold -= rent; players[owner].gold += rent; logMsg(`${p.name} pays ${rent}g rent to ${players[owner].name}`, current); checkBankruptcy(current); }
            }
            renderDashboard(); updateTokens();
        }

        function sendToJail(pIdx) { players[pIdx].pos = 10; players[pIdx].inJail = true; players[pIdx].jailTurns = 0; logMsg(`${players[pIdx].name} sent to Black Hole!`, pIdx); updateTokens(); }
        function getOwner(tileId) { for (let i = 0; i < players.length; i++) { if (players[i].props.find(pp => pp.id === tileId)) return i; } return null; }
        function ownsGroup(pIdx, group) { return TILES.filter(t => t.group === group).every(t => getOwner(t.id) === pIdx); }
        function calcRent(tile, ownerIdx) {
            const prop = players[ownerIdx].props.find(pp => pp.id === tile.id);
            let r = tile.rent; if (prop && prop.houses > 0) r = tile.rent * (1 + prop.houses);
            if (ownsGroup(ownerIdx, tile.group)) r *= 2; return r;
        }

        function buyProperty() {
            const p = players[current]; const tile = TILES[p.pos];
            if (!tile.group || getOwner(tile.id) !== null || p.gold < tile.cost) return;
            p.gold -= tile.cost; p.props.push({ id: tile.id, houses: 0 });
            logMsg(`${p.name} bought ${tile.name} for ${tile.cost}g!`, current);
            renderDashboard(); updateTokens(); updateButtons(); refreshTooltips();
        }

        function canDerive(pIdx, tileId) {
            const p = players[pIdx]; const tile = TILES[tileId || p.pos];
            if (!tile.group) return false;
            const prop = p.props.find(pp => pp.id === tile.id);
            if (!prop || prop.houses >= 5) return false;
            if (p.gold < (tile.houseCost || 50)) return false;
            if (!tile.res) return false;
            return p.inv.M >= tile.res.M && p.inv.L >= tile.res.L && p.inv.T >= tile.res.T;
        }

        function deriveHouseOn(tileId) {
            const p = players[current]; const tile = TILES[tileId];
            if (!canDerive(current, tileId)) return;
            const prop = p.props.find(pp => pp.id === tileId);
            p.gold -= (tile.houseCost || 50);
            p.inv.M -= tile.res.M; p.inv.L -= tile.res.L; p.inv.T -= tile.res.T;
            prop.houses++;
            logMsg(`⚗ ${p.name} derived on ${tile.name}! (${tile.res.M}M+${tile.res.L}L+${tile.res.T}T burned)`, current);
            // Check Grand Unified Theory win
            if (tile.id === 39 && prop.houses >= 5) { triggerGUT(current); return; }
            renderDashboard(); updateTokens(); updateButtons(); refreshTooltips();
            closeModal('labModal'); openLabBench();
        }

        // ── LAB BENCH MODAL ──
        function openLabBench() {
            const p = players[current];
            // Find properties the current player owns
            if (p.props.length === 0) { logMsg('You own no properties to derive on.', current); return; }
            let html = '<h3>⚗ Lab Bench — Derivation</h3>';
            html += '<p style="opacity:.7">Select a property to build on:</p>';
            p.props.forEach(pp => {
                const tile = TILES[pp.id];

        // ── INTENT CLASSIFIER ──
        function aiClassifyIntent(words, raw) {
            const intents = {
                greeting: { kw: ['hello', 'hi', 'hey', 'yo', 'sup', 'hola', 'greet'], weight: 0 },
                thanks: { kw: ['thank', 'thanks', 'thx', 'ty', 'appreciate', 'cool', 'great', 'awesome', 'nice'], weight: 0 },
                help: { kw: ['help', 'assist', 'menu', 'options', 'commands', 'everything'], weight: 0 },
                yes_no: { kw: [], weight: 0 }, // detected by pattern
                quiz: { kw: ['quiz', 'quizzes', 'trivia', 'test', 'exam', 'challenge', 'flashcard', 'crossword', 'puzzle', 'measurement'], weight: 0 },
                derivation: { kw: ['card', 'cards', 'derive', 'derivation', 'formula', 'dimension', 'dimensional', 'needed', 'require', 'build', 'craft', 'mlt', 'ingredients'], weight: 0 },
                game_rule: { kw: ['play', 'rules', 'gameplay', 'rule', 'game'], weight: 0 },
                game_mech: { kw: ['lab', 'bench', 'market', 'trade', 'exchange', 'rent', 'buy', 'property', 'license', 'house', 'houses', 'institute', 'upgrade', 'level', 'station', 'big bang', 'black hole', 'jail', 'tax', 'bankrupt', 'bankruptcy', 'gold', 'money', 'dice', 'roll', 'doubles', 'wormhole', 'peer review', 'chest', 'chance', 'experimental', 'parking', 'vacuum', 'frictionless', 'win', 'victory', 'gut', 'grand unified'], weight: 0 },
                resource: { kw: ['resource', 'card', 'earn', 'collect', 'mlt', 'mass', 'length', 'time'], weight: 0 },
                physics: { kw: ['force', 'velocity', 'speed', 'acceleration', 'momentum', 'work', 'energy', 'power', 'pressure', 'density', 'frequency', 'area', 'volume', 'torque', 'impulse', 'surface tension', 'viscosity', 'entropy', 'gravitational', 'si', 'unit', 'newton', 'joule', 'watt', 'pascal', 'hertz'], weight: 0 },
                strategy: { kw: ['strategy', 'tip', 'tips', 'advice', 'best', 'optimal', 'recommend', 'suggestion', 'trick', 'tricks', 'tactic'], weight: 0 }
            };

            // Yes/No question detection
            if (/^(is there|are there|do we|does it|can i|can we|will there|is it|does the)/.test(raw)) {
                intents.yes_no.weight += 40;
            }

            // Score each intent
            for (const [name, data] of Object.entries(intents)) {
                for (const kw of data.kw) {
                    if (kw.includes(' ') ? raw.includes(kw) : words.includes(kw)) {
                        data.weight += 10 + kw.length * 2;
                    }
                }
            }

            // "What cards for X" / "how to derive X" strongly signals derivation
            if (/cards?\s*(for|needed|require|to)/.test(raw) || /derive|derivation/.test(raw) || /dimension\s*of/.test(raw)) {
                intents.derivation.weight += 35;
            }

            // Pick highest
            let best = 'physics', bestW = 0;
            for (const [name, data] of Object.entries(intents)) {
                if (data.weight > bestW) { bestW = data.weight; best = name; }
            }

            // If yes_no is top, also identify the sub-topic
            if (best === 'yes_no') {
                let sub = 'game_mech';
                let subW = 0;
                for (const [name, data] of Object.entries(intents)) {
                    if (name !== 'yes_no' && data.weight > subW) { subW = data.weight; sub = name; }
                }
                return { primary: 'yes_no', sub };
            }

            return { primary: best, sub: null };
        }

        function aiClean(input) {
            return input.toLowerCase().replace(/[?!.,;:'"(){}[\]]/g, '').trim();

        function aiContentWords(input) {
            return aiClean(input).split(/\s+/).filter(w => !STOP.has(w) && w.length > 0);
